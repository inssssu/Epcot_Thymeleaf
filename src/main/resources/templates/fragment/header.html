<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<div class="d-flex justify-content-between" th:fragment="header">
    <script th:inline="javascript">
        /* <![CDATA[ */
        const userNotice = [[${session.userNotice}]]; // session. 필수!
        if (userNotice) {
            alert(userNotice);
            /*[# th:if="${session.userNotice != null}"]*/
            // 브라우저에서 알림 후 세션을 비우는 요청을 보내거나 무시 가능
            /*[/]*/
        }
        /* ]]> */
    </script>
    <div>
        <a th:href="@{/}">
            Logo
        </a>
    </div>
    <div class="col-5 justify-content-end navbar ms-4">
        <div class="d-flex gap-3 align-items-center">
            <a sec:authorize="hasAuthority('master_admin')" class="btn btn-outline-primary" th:href="@{/admin/log/list}">관리자 로그</a>

            <a sec:authorize="hasAnyAuthority('admin', 'master_admin')" class="btn btn-outline-primary" th:href="@{/admin/users}">사용자 관리</a>

<!--            <div style="background: yellow; color: black; padding: 10px;">-->
<!--                로그인 ID: <span sec:authentication="name"></span> <br>-->
<!--                내 권한들: <span sec:authentication="principal.authorities"></span>-->
<!--            </div>-->
            <a class="btn btn-outline-primary" th:href="@{/board/list}">게시글</a>

            <div sec:authorize="isAnonymous()">
                <a class="btn btn-outline-primary" th:href="@{/login}">로그인</a>
            </div>

            <div sec:authorize="isAuthenticated()">
                <a class="btn btn-outline-primary" th:href="@{/mypage}" th:text="${#authentication.name}">id</a>
            </div>

            <div sec:authorize="isAuthenticated()">
                <a class="btn btn-outline-danger" th:href="@{/logout}">로그아웃</a>
            </div>
        </div>
    </div>
</div>
</html>
