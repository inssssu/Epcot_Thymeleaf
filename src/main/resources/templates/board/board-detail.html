<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>board detail</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body class="container mt-5">
    <header>
        <div th:replace="~{fragment/header :: header}"></div>
    </header>
    <div class="container-4">
        <div class="card card-header d-flex justify-content-between align-items-start mt-3">
            <h2 class="text-start" th:text="${item.title}">제목</h2>
            <div class="">
                <div class="" th:text="'작성자 : ' + ${item.author.username}">
                    작성자
                </div>
                <div class="" th:text="'작성일 : ' + ${#temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm')}">
                    작성일
                </div>
            </div>
        </div>
        <div class="card card-body mt-3" style="height: 350px; white-space: pre-wrap;" th:text="${item.content}">
            게시글 내용
        </div>

        <div class="card card-body mt-3 p-2">
            <div th:if="${attachedFiles == null || #lists.isEmpty(attachedFiles)}">
                첨부파일이 없습니다
            </div>

            <div th:if="${attachedFiles != null && !#lists.isEmpty(attachedFiles)}">
                <ul class="d-flex mb-3" style="list-style: none; padding-left: 0;">
                    <li th:each="f : ${attachedFiles}" class="me-4">
                        <i class="bi bi-file-earmark-arrow-down"></i> <a th:href="@{/board/files/{fileId}/download(fileId=${f.id})}"
                                                                         th:text="${f.originalName}" class="text-decoration-none">download</a>
                    </li>
                </ul>

                <div id="images_container" class="d-flex flex-wrap gap-2">
                    <th:block th:each="f : ${attachedFiles}">
                        <img th:if="${f.contentType != null && #strings.startsWith(f.contentType, 'image')}"
                             th:src="@{/board/files/{fileId}/view(fileId=${f.id})}"
                             alt="미리보기"
                             class="img-thumbnail"
                             style="width: 200px; height: 150px; object-fit: cover;">
                    </th:block>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-between">
            <div>
                <a th:href="@{/board/list(page=${page + 1})}" class="btn btn-success mt-3">목록</a>
            </div>
            <div class="d-flex justify-content-end mt-3 gap-3">

                <a th:href="@{/board/edit/{id}(id=${item.id})}" class="btn btn-warning">수정</a>

                <form th:action="@{/board/detail/{id}/delete(id=${item.id})}" method="post"
                      onsubmit="return confirm('삭제하시겠습니까?')"
                      class="m-0"
                >
                    <input type="hidden" th:if="${_csrf != null}"
                           th:name="${_csrf.parameterName}" th:value="${_csrf.token}"
                    />
                    <button type="submit" class="btn btn-danger">삭제</button>
                </form>
            </div>
        </div>
    </div>
</body>

<script>

</script>

</html>
