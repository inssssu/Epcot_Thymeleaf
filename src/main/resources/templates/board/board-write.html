<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>board write</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body class="container mt-5">
    <div class="card board-card shadow-sm border-8">
        <div class="card-body p-4 p-md-5">
            <form th:action="@{/board/write}" method="post">
                <div class="mb-3">
                    <input
                        id="title"
                        name="title"
                        type="text"
                        class="form-control form-control-lg board-input"
                        placeholder="제목"
                        th:values="${title}"
                    >
                </div>

                <div class="mb-4">
                    <textarea
                        id="content"
                        name="content"
                        class="form-control board-textarea "
                        rows="12"
                        placeholder="내용"
                        th:values="${content}"
                    ></textarea>
                </div>

                <div class="mb-4 d-flex">
                    <!-- 첨부파일명 목록 -->
                    <div class="card board-card flex-grow-1 me-2">
                        <div>첨부파일</div>
                        <div>선택된 파일이 없습니다</div>
                    </div>

                    <!-- 첨부파일 업로드 버튼  -->
                    <div class="d-flex ">
                        <button class="btn btn-primary">파일 첨부</button>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-3">
                    <a class="btn btn-danger" th:href="@{/board/list}">취소</a>
                    <button class="btn btn-success">확인</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
