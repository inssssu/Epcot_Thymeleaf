<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>board write</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body class="container mt-5">
    <div class="card board-card shadow-sm border-8">
        <div class="card-body p-4 p-md-5">
            <form
                th:object="${item}"
                th:action="*{id} == null ? @{/board/write} : @{/board/edit/{id}(id=*{id})}"
                method="post"
                enctype="multipart/form-data"
            >
                <div class="mb-3">
                    <input
                        type="text"
                        class="form-control form-control-lg board-input"
                        placeholder="제목"
                        th:field="*{title}"
                    >
                </div>

                <div class="mb-4">
                    <textarea
                        class="form-control board-textarea "
                        rows="12"
                        placeholder="내용"
                        th:field="*{content}"
                    ></textarea>
                </div>

                <div class="mb-4 d-flex">
                    <!-- 첨부파일명 목록 -->
                    <div class="card board-card flex-grow-1 me-2 p-2">
                        <div>첨부파일</div>

                        <div th:if="${attachedFiles == null || #lists.isEmpty(attachedFiles)}" id="fileNameText">
                            선택된 파일이 없습니다
                        </div>

                        <ul class="mb-0" id="attachedFileList" th:if="${attachedFiles != null && !#lists.isEmpty(attachedFiles)}">
                            <li th:each="f : ${attachedFiles}" th:text="${f.originalName}">file</li>
                        </ul>

                        <ul class="mb-0" id="selectedFileList" style="display:none;"></ul>

                    </div>

                    <!-- 첨부파일 업로드 버튼  -->
                    <div class="d-flex align-items-start">
                        <label class="btn btn-primary mb-0">
                            파일첨부
                            <input class="form-control" type="file" id="fileInput" name="files"
                                   onChange="onFileChange(this)" multiple hidden>
                        </label>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-3">
                    <a class="btn btn-danger" th:href="@{/board/list}">취소</a>
                    <button type="submit" class="btn btn-success">확인</button>
                </div>
            </form>
        </div>
    </div>
</body>

<script th:inline="javascript">
    let selectedFiles = [];

    function onFileChange(input) {
        const files = Array.from(input.files || []);

        selectedFiles = files;

        renderSelectedFiles(input);

        // const label = document.getElementById('fileNameText');
        //
        // if (input.files && input.files.length > 0) {
        //     label.textContent = input.files[0].name;
        // } else {
        //     label.textContent = '선택된 파일이 없습니다';
        // }
        //
        // const files = input.files;
        //
        // const emptyText = document.getElementById('fileNameText');
        // const selectedList = document.getElementById('selectedFileList');
        //
        // if (!files || files.length === 0) {
        //     if (selectedList) selectedList.style.display = 'none';
        //     if (emptyText) emptyText.style.display = 'none';
        //     return;
        // }
        //
        // if (emptyText) emptyText.style.display = 'none';
        //
        // if (selectedList) {
        //     selectedList.style.display = '';
        //     Array.from(files).forEach(f => {
        //         const li = document.createElement('li');
        //         li.textContent = f.name;
        //         selectedList.appendChild(li);
        //     });
        // }
    }

    function renderSelectedFiles(input) {
        const emptyText = document.getElementById('fileNameText');
        const selectedList = document.getElementById('selectedFileList');

        selectedList.innerHTML = '';

        if (selectedFiles.length === 0) {
            selectedList.style.display = 'none';
            if (emptyText) {
                emptyText.style.display = 'none';
            }
            input.value = '';
            return;
        }

        if (emptyText) {
            emptyText.style.display = 'none';
        }

        selectedList.style.display = '';
        selectedFiles.forEach((file, idx) => {
            const li = document.createElement('li');
            li.className = 'd-flex justify-content-between align-items-center';

            const nameSpan = document.createElement('span');
            nameSpan.textContent = file.name;

            const deleteBtn = document.createElement('button');
            deleteBtn.type = 'button';
            deleteBtn.className = 'btn btn-outline-danger btn-sm';
            deleteBtn.textContent = 'X';
            deleteBtn.addEventListener('click', () => removeSelectedFile(idx, input));

            li.appendChild(nameSpan);
            li.appendChild(deleteBtn);
            selectedList.appendChild(li);
        });

        syncInputFiles(input);
    }

    function removeSelectedFile(index, input) {
        selectedFiles.splice(index, 1);
        renderSelectedFiles(input);
    }

    function syncInputFiles(input) {
        const dt = new DataTransfer();
        selectedFiles.forEach(f => dt.items.add(f));
        input.files = dt.files;

        if (selectedFiles.length === 0) {
            input.value = '';
        }
    }
</script>

</html>
