<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>board write</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body class="container mt-5">
    <div class="card board-card shadow-sm border-8">
        <div class="card-body p-4 p-md-5">
            <form
                th:object="${item}"
                th:action="*{id} == null ? @{/board/write} : @{/board/edit/{id}(id=*{id})}"
                method="post"
                enctype="multipart/form-data"
            >
                <div class="mb-3">
                    <input
                        type="text"
                        class="form-control form-control-lg board-input"
                        placeholder="제목"
                        th:field="*{title}"
                    >
                </div>

                <div class="mb-4">
                    <textarea
                        class="form-control board-textarea "
                        rows="12"
                        placeholder="내용"
                        th:field="*{content}"
                    ></textarea>
                </div>

                <div class="mb-4 d-flex">
                    <!-- 첨부파일명 목록 -->
                    <div class="card board-card flex-grow-1 me-2 p-2">
                        <div>첨부파일</div>

                        <div th:if="${attachedFiles == null || #lists.isEmpty(attachedFiles)}" id="fileNameText">
                            선택된 파일이 없습니다
                        </div>
                        <ul class="mb-0" th:if="${attachedFiles != null && !#lists.isEmpty(attachedFiles)}">
                            <li th:each="f : ${attachedFiles}" th:text="${f.originalName}">file</li>
                        </ul>
                    </div>


                    <!-- 첨부파일 업로드 버튼  -->
                    <div class="d-flex align-items-start">
                        <label class="btn btn-primary mb-0">
                            파일첨부
                            <input type="file" name="files" class="form-control"
                                   onChange="onFileChange(this)" multiple hidden>
                        </label>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-3">
                    <a class="btn btn-danger" th:href="@{/board/list}">취소</a>
                    <button type="submit" class="btn btn-success">확인</button>
                </div>
            </form>
        </div>
    </div>
</body>

<script th:inline="javascript">
    function onFileChange(input) {
        const label = document.getElementById('fileNameText');

        if (input.files && input.files.length > 0) {
            label.textContent = input.files[0].name;
        } else {
            label.textContent = '선택된 파일이 없습니다';
        }
    }
</script>

</html>
