<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>board write</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<header>
    <div th:replace="~{fragment/header :: header}"></div>
</header>
<body class="container mt-5">
    <div class="card board-card shadow-sm border-8 mt-3">
        <div class="card-body p-4 ">
            <form
                th:if="*{id == null}"
                th:object="${item}"
                th:action="@{/board/write}"
                method="post"
                enctype="multipart/form-data"
            >
                <div class="mb-3">
                    <input type="text" class="form-control form-control-lg board-input"
                           placeholder="제목" th:field="*{title}">
                </div>

                <div class="mb-4">
                    <textarea class="form-control board-textarea" rows="12"
                              placeholder="내용" th:field="*{content}">내용</textarea>
                </div>

                <div class="mb-4 d-flex">
                    <!-- 첨부파일명 목록 -->
                    <div class="card board-card flex-grow-1 px-2 pb-2">
                        <div class="form-group ">
                            <label for="preview_image"></label>
                            <input type="file" multiple="multiple" class="form-control form-control-user"
                                   name="files" id="preview_image" onchange="setDetailImage(event)">
                        </div>

                        <ul class="d-flex mb-0" id="attachedFileList" th:if="${attachedFiles != null && !#lists.isEmpty(attachedFiles)}">
                            <li class="me-5" th:each="f : ${attachedFiles}" th:text="${f.originalName}">file</li>
                        </ul>

                        <div class="form-group">
                            <input type="file" class="form-control form-control-user"
                                   name="product_image" id="product_image" onchange="setThumbnail(event)">
                        </div>
                        <div id="image_container"></div>
                        <div class="form-group">
                            <input type="file" multiple="multiple" class="form-control form-control-user"
                                   name="product_detail_image" id="product_detail_image" onchange="setDetailImage(event)">
                        </div>

                        <div id="images_container" class="d-flex flex-wrap mb-2"></div>

                        <ul class="mb-0" id="selectedFileList" style="display:none;"></ul>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-3">
                    <a class="btn btn-danger" th:href="@{/board/list}">취소</a>
                    <button type="submit" class="btn btn-success">확인</button>
                </div>
            </form>
        </div>
    </div>
</body>

<script th:inline="javascript">
    function setThumbnail(event) {
        var reader = new FileReader();

        reader.onload = function (event) {
            var img = document.createElement("img");
            img.setAttribute("src", event.target.result);
            img.setAttribute("class", "col-lg-6");
            document.querySelector("div#image_container").appendChild(img);
        };

        reader.readAsDataURL(event.target.files[0]);
    }

    function setDetailImage(event) {
        const input = event.target;
        const files = input.files;

        const emptyText = document.getElementById('fileNameText');
        const listEl = document.getElementById('selectedFileList');
        const previewEl = document.getElementById('images_container');

        listEl.innerHTML = '';
        previewEl.innerHTML = '';

        if (!files || files.length === 0) {
            listEl.style.display = 'none';
            if (emptyText) {
                emptyText.style.display = 'none';
            }
            return;
        }

        if (emptyText) {
            emptyText.style.display = 'none';
        }

        listEl.style.display = 'none';

        Array.from(files).forEach(file => {
            const li = document.createElement('li');
            li.textContent = file.name;
            listEl.appendChild(li);

            const reader = new FileReader();
            reader.onload = e => {
                const img = document.createElement('img');
                img.src = e.target.result;
                img.className = 'd-flex col-lg-6 img-thumbnail me-2 mt-2'
                // img.style = ' width: 200px; height: 150px;'
                img.style.width = '200px';
                img.style.MaxHeight = '150px';
                previewEl.appendChild(img);
            };
            reader.readAsDataURL(file);
        });
    }
</script>

</html>
