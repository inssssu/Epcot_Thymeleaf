    <div th:replace="~{fragment/header :: header}"></div>
</header>

    <div class="container-lg my-4 py-4">
        <div class="">
            <div class="">
                <div class="d-flex justify-content-between">
                    <h2 class="mb-4">마이페이지</h2>
                </div>


                <div class="d-flex justify-content-between">
                    <div class="card p-3">
                        상세정보

<!--                        </div>-->
                        <div class="card-body" style="width: 25rem">
                            <div id="view-mode">
                                <dl class="row mb-0">
                                    <dt class="col-4 text-secondary">아이디</dt>
                                    <dd class="col-8" th:text="${user.username}">test1</dd>

                                    <dt class="col-4 text-secondary">비밀번호</dt>
                                    <dd class="col-8">*********</dd>

                                    <dt class="col-4 text-secondary">사용자 구분</dt>
                                    <dd class="col-8" th:text="${user.role.description}">일반 사용자</dd>
                                </dl>
<!--                                <div class="d-flex justify-content-between mt-3">-->
<!--                                    <form th:action="@{/user/withdraw}" th:if="${user.status?.statusName == 'active'}" method="post">-->
<!--                                        <input type="hidden" name="userId" th:value="${user.id}">-->
<!--                                        <button type="submit" class="btn btn-outline-danger">회원탈퇴</button>-->
<!--                                    </form>-->
<!--                                    <div th:if="${user.status.getStatusName() == 'withdrawal_req'}" class="alert alert-warning">-->
<!--                                        탈퇴 승인 대기 중입니다-->
<!--                                        <form th:action="@{/user/withdraw/cancel}" method="post" style="display: inline;">-->
<!--                                            <input type="hidden" name="userId" th:value="${user.id}">-->
<!--                                            <button type="submit" class="btn btn-outline-secondary">탈퇴 신청 취소</button>-->
<!--                                        </form>-->
<!--                                    </div>-->

<!--                                </div>-->
                                <div class="d-flex flex-column mt-3">
                                    <div th:if="${user.status?.statusName == 'active'}" class="w-100">
                                        <div class="d-flex justify-content-between">
                                            <button type="button" class="btn btn-outline-danger" onclick="toggleWithdrawSection()">회원탈퇴</button>
                                            <button type="button" class="btn btn-outline-primary" onclick="toggleEditMode()">정보수정</button>
                                        </div>

                                        <div id="withdrawSection" style="display: none;" class="mt-3 p-3 border rounded bg-light">
                                            <form th:action="@{/user/withdraw}" method="post" id="withdrawForm">
                                                <input type="hidden" name="userId" th:value="${user.id}">
                                                <div class="mb-3">
                                                    <label for="withdrawalReason">탈퇴 사유</label>
                                                    <textarea class="form-control" id="withdrawalReason" name="withdrawalReason"
                                                              rows="5" style="resize: none;"></textarea>
                                                    <small id="reasonHelp" class="text-danger" style="display: none;">사유를 입력해 주세요</small>
                                                </div>
                                                <div class="d-flex justify-content-end gap-2">
                                                    <button type="button" class="btn btn-secondary btn-sm me-2" onclick="toggleWithdrawSection()">취소</button>
                                                    <button type="button" class="btn btn-danger btn-sm" onclick="submitWithdraw()">탈퇴 신청 확정</button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                    <div th:if="${user.status?.statusName == 'withdrawal_req'}" class="alert alert-warning d-flex justify-content-between align-items-center">
                                        <span>탈퇴 승인 대기 중입니다</span>
                                        <form th:action="@{/user/withdraw/cancel}" method="post" class="m-0">
                                            <input type="hidden" name="userId" th:value="${user.id}">
                                            <button type="submit" class="btn btn-sm btn-outline-secondary">탈퇴 신청 취소</button>
                                        </form>
                                    </div>
                                </div>
                            </div>

                            <form id="edit-mode" th:action="@{/mypage/edit}" method="post" style="display: none;" onsubmit="return validatePassword()">
                                <div class="mb-3 row">
                                    <label for="username" class="col-sm-4 col-form-label text-secondary">아이디</label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" id="username" name="username" th:value="${user.username}" disabled>
                                    </div>
                                </div>
                                <div class="mb-3 row mt-2">
                                    <label for="newPassword" class="col-sm-4 col-form-label text-secondary">새 비밀번호</label>
                                    <div class="col-sm-8">
                                        <input type="password" class="form-control" id="newPassword" name="newPassword" placeholder="새 비밀번호" required>
                                    </div>
                                </div>

                                <div class="mb-3 row mt-2">
                                    <label for="newPasswordCheck" class="col-sm-4 col-form-label text-secondary">비밀번호 확인</label>
                                    <div class="col-sm-8">
                                        <input type="password" class="form-control" id="newPasswordCheck" name="newPasswordCheck" placeholder="비밀번호 확인" required>
                                    </div>
                                </div>

                                <div id="password-error-msg" class="text-danger mt-1" style="display: none; font-size: 0.9rem"></div>

                                <div class="d-flex justify-content-end gap-2 mt-2">
                                    <button type="button" class="btn btn-secondary" onclick="toggleEditMode()">취소</button>
                                    <button type="submit" class="btn btn-primary">저장</button>
                                </div>

                    <div class="card p-3">
                        <div class="card-body" style="width: 45rem">
                            활동내용 리스트
                            <div th:if="${myBoardsPage == null || #lists.isEmpty(myBoardsPage)}" class="text-secondary">
                                작성한 게시글이 없습니다.
                            </div>
                            <ul class="list-group list-group-flush" th:if="${myBoards != null && !#lists.isEmpty(myBoardsPage)}">
                                <li class="list-group-item d-flex justify-content-between align-items-center"
                                    th:each="b : ${myBoardsPage}">
                                    <div class="text-truncate" style="max-width: 75%;">
                                        <a th:href="@{/board/detail/{id}(id=${b.id})}"
                                           th:text="${b.title}" class="text-decoration-none link-dark"
                                        >제목</a>
                                    </div>
                                    <small class="text-secondary" th:text="${#temporals.format(b.createdAt, 'yyyy-MM-dd')}">2026-01-01</small>
                                </li>
                            </ul>

                            <!-- 사용자가 작성한 게시글의 페이지네이션 -->
                            <nav th:if="${myBoardsPage.totalPages > 1}" aria-label="Page navigation" class="mt-3">
                                <ul class="pagination justify-content-center">
                                    <li class="page-item" th:classappend="${!myBoardsPage.hasPrevious()} ? ' disabled'">
                                        <a class="page-link" th:href="@{/mypage(page=1)}"><<</a>
                                    </li>

                                    <li class="page-item" th:classappend="${!myBoardsPage.hasPrevious()} ? ' disabled'">
                                        <a class="page-link" th:href="@{/mypage(page=${myBoardsPage.number})}" tabindex="-1">이전</a>
                                    </li>

                                    <li class="page-item" th:each="p : ${#numbers.sequence(1, myBoardsPage.totalPages)}"
                                        th:classappend="${p == myBoardsPage.number + 1} ? ' active'">
                                        <a class="page-link" th:href="@{/mypage(page=${p})}" th:text="${p}">1</a>
                                    </li>

                                    <li class="page-item" th:classappend="${!myBoardsPage.hasNext()} ? ' disabled'">
                                        <a class="page-link" th:href="@{/mypage(page=${myBoardsPage.number + 2})}">다음</a>
                                    </li>

                                    <li class="page-item" th:classappend="${!myBoardsPage.hasNext()} ? ' disabled'">
                                        <a class="page-link" th:href="@{/mypage(page=${myBoardsPage.getTotalPages()})}">>></a>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

<script>
    function toggleEditMode() {
        const viewMode = document.getElementById('view-mode');
        const editMode = document.getElementById('edit-mode');

        document.getElementById('password-error-msg').style.display = 'none';
        document.getElementById('newPassword').value = '';
        document.getElementById('newPasswordCheck').value = '';

        if (viewMode.style.display === 'none') {
            viewMode.style.display = 'block';
            editMode.style.display = 'none';
        } else {
            viewMode.style.display = 'none';
            editMode.style.display = 'block';
        }
    }

    function validatePassword() {
        const password = document.getElementById('newPassword').value;
        const newPasswordCheck = document.getElementById('newPasswordCheck').value;
        const errorMsg = document.getElementById('password-error-msg');

        if (password !== newPasswordCheck) {
            errorMsg.innerText = "비밀번호가 일치하지 않습니다";
            errorMsg.style.display = 'block';

            document.getElementById('newPassword').focus();

            return false;
        }

        errorMsg.style.display = 'none';
        return true;
    }

    function toggleWithdrawSection() {
        const section = document.getElementById('withdrawSection');
        if (section.style.display === 'none') {
            section.style.display = 'block';
        } else {
            section.style.display = 'none';
            document.getElementById('withdrawalReason').value = '';
            document.getElementById('reasonHelp').style.display = 'none';
        }
    }

    function submitWithdraw() {
        const reasonField = document.getElementById('withdrawalReason');
        const helpText = document.getElementById('reasonHelp');
        const form = document.getElementById('withdrawForm');

        if (reasonField.value.trim() === '') {
            reasonField.classList.add('is-invalid');
            helpText.style.display = 'block';
            reasonField.focus();
            return;
        }

        if (confirm("탈퇴 신청 후에는 관리자 승인이 필요합니다.")) {
            form.submit();
        }
    }
</script>

</html>
