<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="container mt-5">
<header>
    <div th:replace="~{fragment/header :: header}"></div>
</header>

    <div class="container-lg my-4 py-4">
        <div class="">
            <div class="">
                <div class="d-flex justify-content-between">
                    <h2 class="mb-4">마이페이지</h2>
                </div>


                <div class="d-flex justify-content-between">
                    <div class="card p-3">
                        상세정보
<!--                        <div class="card-body" style="width: 25rem; height: 15rem">-->
<!--                            <dl class="row mb-0">-->
<!--                                <dt class="col-4- text-secondary">아이디</dt>-->
<!--                                <dd class="col-8" th:text="${user.username}">test</dd>-->
<!--                            </dl>-->
<!--                        </div>-->

<!--                        <div class="mt-3 d-flex justify-content-end">-->
<!--                            <a th:href="@{/mypage/edit}" class="btn btn-outline-primary">정보 수정</a>-->
<!--                        </div>-->
                        <div class="card-body" style="width: 25rem">
                            <div id="view-mode">
                                <dl class="row mb-0">
                                    <dt class="col-4 text-secondary">아이디</dt>
                                    <dd class="col-8" th:text="${user.username}">test1</dd>

                                    <dt class="col-4 text-secondary">비밀번호</dt>
                                    <dd class="col-8">*********</dd>
                                </dl>
                                <div class="d-flex justify-content-end">
                                    <button type="button" class="btn btn-outline-primary" onclick="toggleEditMode()">정보 수정</button>
                                </div>
                            </div>

                            <form id="edit-mode" th:action="@{/mypage/edit}" method="post" style="display: none;">
                                <div class="mb-3 row">
                                    <label for="username" class="col-sm-4 col-form-label text-secondary">아이디</label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" id="username" name="username" th:value="${user.username}" disabled>
                                    </div>
                                </div>
                                <div class="mb-3 row mt-2">
                                    <label for="password" class="col-sm-4 col-form-label text-secondary">새 비밀번호</label>
                                    <div class="col-sm-8">
                                        <input type="password" class="form-control" id="password" name="password" placeholder="새 비밀번호" required>
                                    </div>
                                </div>

                                <div class="mb-3 row mt-2">
                                    <label for="passwordCheck" class="col-sm-4 col-form-label text-secondary">비밀번호 확인</label>
                                    <div class="col-sm-8">
                                        <input type="password" class="form-control" id="passwordCheck" name="passwordCheck" placeholder="비밀번호 확인" required>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 mt-2">
                                    <button type="button" class="btn btn-secondary" onclick="toggleEditMode()">취소</button>
                                    <button type="submit" class="btn btn-primary">저장</button>
                                </div>
                            </form>
                        </div>
                    </div>
                    <div class="card p-3">
                        <div th:if="${myBoards == null || #lists.isEmpty(myBoards)}" class="text-secondary">
                            작성한 게시글이 없습니다.
                        </div>
                        <div class="card-body" style="width: 45rem">
                            활동내용 리스트
                            <ul class="list-group list-group-flush" th:if="${myBoards != null && !#lists.isEmpty(myBoards)}">
                                <li class="list-group-item d-flex justify-content-between align-items-center"
                                    th:each="b : ${myBoards}">
                                    <div class="text-truncate" style="max-width: 75%;">
                                        <a th:href="@{/board/detail/{id}(id=${b.id})}"
                                           th:text="${b.title}" class="text-decoration-none link-dark"
                                        >제목</a>
                                    </div>
                                    <small class="text-secondary" th:text="${#temporals.format(b.createdAt, 'yyyy-MM-dd')}">2026-01-01</small>
                                </li>
                            </ul>

                            <!-- 사용자가 작성한 게시글의 페이지네이션 -->
                            <nav th:if="${myBoardsPage.totalPages > 1}" aria-label="Page navigation" class="mt-3">
                                <ul class="pagination justify-content-center">
                                    <li class="page-item" th:classappend="${!myBoardsPage.hasPrevious()} ? ' disabled'">
                                        <a class="page-link" th:href="@{/mypage(page=1)}"><<</a>
                                    </li>

                                    <li class="page-item" th:classappend="${!myBoardsPage.hasPrevious()} ? ' disabled'">
                                        <a class="page-link" th:href="@{/mypage(page=${myBoardsPage.number})}" tabindex="-1">이전</a>
                                    </li>

                                    <li class="page-item" th:each="p : ${#numbers.sequence(1, myBoardsPage.totalPages)}"
                                        th:classappend="${p == myBoardsPage.number + 1} ? ' active'">
                                        <a class="page-link" th:href="@{/mypage(page=${p})}" th:text="${p}">1</a>
                                    </li>

                                    <li class="page-item" th:classappend="${!myBoardsPage.hasNext()} ? ' disabled'">
                                        <a class="page-link" th:href="@{/mypage(page=${myBoardsPage.number + 2})}">다음</a>
                                    </li>

                                    <li class="page-item" th:classappend="${!myBoardsPage.hasNext()} ? ' disabled'">
                                        <a class="page-link" th:href="@{/mypage(page=${myBoardsPage.getTotalPages()})}">>></a>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

<script>
    function toggleEditMode() {
        const viewMode = document.getElementById('view-mode');
        const editMode = document.getElementById('edit-mode');

        if (viewMode.style.display === 'none') {
            viewMode.style.display = 'block';
            editMode.style.display = 'none';
        } else {
            viewMode.style.display = 'none';
            editMode.style.display = 'block';
        }
    }
</script>

</html>
